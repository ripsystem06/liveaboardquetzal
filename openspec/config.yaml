# openspec/config.yaml — liveaboardquetzal
# Generated by sdd-init 2026-07-21. Hybrid mode (openspec + engram).

schema: spec-driven

context: |
  Next.js 16 App Router + React 19 + TypeScript (strict)
  TailwindCSS 4 + shadcn/ui (new-york, Radix UI)
  Prisma 5 + PostgreSQL (Vercel Postgres)
  Liveaboard diving travel platform
  Testing: Vitest 4 + Testing Library + jsdom (28 suites, 262 tests)
  Forms: react-hook-form + zod | Email: Resend | PDF: jsPDF | Charts: recharts

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing patterns (Next.js App Router, shadcn/ui, server-first)
      - Use React Server Components by default; client components only when needed
      - Prefer server-side data fetching with Prisma
    tdd: true
    test_command: "npx vitest run"
  verify:
    test_command: "npx vitest run"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  runner:
    command: "npx vitest run"
    framework: "Vitest 4.1.8"
  layers:
    unit: { available: true, tool: "Vitest" }
    integration: { available: true, tool: "Vitest + Testing Library + jsdom" }
    e2e: { available: false, tool: null }
  coverage:
    available: false
    command: null
  quality:
    linter: { available: true, command: "npx eslint ." }
    type_checker: { available: true, command: "npx tsc --noEmit" }
    formatter: { available: false, command: null }
